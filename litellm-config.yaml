model_list:
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY

guardrails:
  - guardrail_name: "presidio-pii"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      # Restores real values in the model's reply instead of leaving
      # placeholders like <PERSON> in what you see. Test a round-trip
      # after deploying — this path has had bugs on some providers.
      output_parse_pii: true
      presidio_language: "en"
      pii_entities_config:
        EMAIL_ADDRESS: "MASK"
        PHONE_NUMBER: "MASK"
        PERSON: "MASK"
        CREDIT_CARD: "MASK"
        US_SSN: "MASK"
