model_list:
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      guardrails:
        - "presidio-pii"

guardrails:
  - guardrail_name: "presidio-pii"
    litellm_params:
      guardrail: presidio
      mode:
        - "pre_call"
        - "post_call"
      output_parse_pii: true
      presidio_language: "en"
      pii_entities_config:
        EMAIL_ADDRESS: "MASK"
        PHONE_NUMBER: "MASK"
        PERSON: "MASK"
        CREDIT_CARD: "MASK"
        US_SSN: "MASK"
