healthCheckTimeout: 60

# ── Port map ────────────────────────────────────────────────
#   8000  llama-swap  (entry point tunggal untuk semua traffic)
#   8001  llama-server  model LLM   (di-swap oleh llama-swap)
#   8002  llama-server  embedding   (always resident, ttl: 0)
# ────────────────────────────────────────────────────────────

# ── YAML Anchors ─────────────────────────────────────────────
# Blok ini diabaikan llama-swap; hanya untuk DRY authoring.
.anchors:
  on_8001: &on_8001
    ttl: 300
    proxy: "http://127.0.0.1:8001"

models:

  # ══ Qwen3.5-2B-UD-Q4_K_XL ════════════════════════════════
  # --no-mmproj-offload : mmproj tetap di CPU untuk hemat VRAM
  # -np 1               : vision model tidak bisa share KV cache

    # PRESET 1 — Thinking · General
  # Thinking: ON  | temp=1.0, top_p=0.95, presence_penalty=1.5
  # Terbaik untuk: analisis, penulisan, pertanyaan terbuka
  "Qwen3.5-2B-UD-Q4_K_XL [Thinking · General]":
    <<: *on_8001
    cmd: >
      /app/llama-server
      --port 8001 --host 0.0.0.0
      --model /models/models/Qwen3.5-2B/Qwen3.5-2B-UD-Q4_K_XL.gguf --mmproj /models/models/Qwen3.5-2B/mmproj-F16.gguf
      --fit on --mlock
      -c 32768 -t 4 -tb 4 -b 512 -ub 256
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --jinja --no-warmup --no-mmproj-offload -np 1
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --presence-penalty 1.5 --repeat-penalty 1.0
      --cache-reuse 256
      --chat-template-kwargs '{"enable_thinking":true}'

  # PRESET 2 — Thinking · Coding
  # Thinking: ON  | temp=0.6, presence_penalty=0.0
  # Terbaik untuk: algoritma kompleks, debugging, keputusan arsitektur
